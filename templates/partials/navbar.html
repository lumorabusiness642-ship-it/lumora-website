<header class="site-header" id="siteHeader">
  <div class="container nav-wrap">
    <a class="brand" href="{{ url_for('home') }}" aria-label="{{ site.brand_name }}">
      <img src="{{ url_for('static', filename=(site.logo_path or 'img/logo.png')) }}" alt="{{ site.brand_name }} logo">
      <span>{{ site.brand_name }}</span>
    </a>

    <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav-links" id="navLinks">
      <a href="{{ url_for('home') }}#home">Home</a>
      <a href="{{ url_for('home') }}#about">About</a>
      <a href="{{ url_for('home') }}#services">Services</a>
      <a href="{{ url_for('home') }}#portfolio">Portfolio</a>
      <a href="{{ url_for('home') }}#contact">Contact</a>
    </nav>
  </div>
</header>
