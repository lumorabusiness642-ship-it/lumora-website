{% extends "admin/base.html" %}
{% block title %}Password — {{ site.brand_name }}{% endblock %}
{% block admin_content %}
<div class="page-head"><div><span class="top-label">Security</span><h1>Change password</h1><p>Use a strong password of at least 8 characters.</p></div></div>
<section class="panel narrow-panel">
<form method="post" class="form-stack">
  <label>Current password<input type="password" name="current_password" required></label>
  <label>New password<input type="password" name="new_password" required minlength="8"></label>
  <label>Confirm new password<input type="password" name="confirm_password" required minlength="8"></label>
  <button class="btn-admin primary" type="submit">Update password</button>
</form>
</section>
{% endblock %}
